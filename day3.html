<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <h1>STUDENT REGISTER FORM</h1>
    <label for="" >First Name</label>
    <input type="text" required><br><br>
    <label for="">Last Name</label>
    <input type="text"><br><br>
    <label for="">Date-of-Birth</label>
    <input type="datetime-local"><br><br>
    <label for="" >Email-id</label>
    <input type="email" required><br><br>
    <label for="">Mobile Number</label>
    <input type="number"><br><br>
    <label for="">Gender</label>
    <input type="radio" name="gender">
    <label for="">Male</label>
    <input type="radio" name="gender">
    <label for="">Female</label><br><br>
    <label for="">Address</label>
    <textarea></textarea><br><br>
    <label for="">City</label>
    <input type="text"><br><br>
    <label for="">Pincode</label>
    <input type="number"><br><br>
    <label for="">State</label>
    <input type="text"><br><br>
    <label for="">Country</label>
    <input type="text"><br><br>
    <label for="">Hobbies Drawing</label>
    <input type="radio" name="Hobbies">
    <label for="">Singing</label>
    <input type="radio" name="Hobbies">
    <label for="">Dancing</label>
    <input type="radio" name="Hobbies">
    <label for="">Sketching</label>
    <input type="radio" name="Hobbies">
    <label for="">Others</label>
    <input type="text"><br><br>
    <label for="">Qualification</label>
    <table>
        <tr>
            <th>S.No</th>
            <th>Examination</th>
            <th>Board</th>
            <th>Percentage</th>
            <th>Year of Passing</th>
        </tr>
        <tr>
            <th>1</th>
            <th>Class X</th>
            <th><input type="text"></th>
            <th><input type="text"></th>
            <th><input type="text"></th>
        </tr>
        <tr>
            <th>2</th>
            <th>Class XII</th>
            <th><input type="text"></th>
            <th><input type="text"></th>
            <th><input type="text"></th>
        </tr>
        <tr>
            <th>3</th>
            <th>Graduation</th>
            <th><input type="text"></th>
            <th><input type="text"></th>
            <th><input type="text"></th>
        </tr>
        <tr>
            <th>4</th>
            <th>Masters</th>
            <th><input type="text"></th>
            <th><input type="text"></th>
            <th><input type="text"></th>
        </tr>
    </table>
    <br>
    <label for="">Courses Applied for</label><br>
    <label for="">BCA</label>
    <input type="radio" name="course">
    <label for="">B.Com</label>
    <input type="radio" name="course">
    <label for="">B.Sc</label>
    <input type="radio" name="course">
    <label for="">B.A</label>
    <input type="radio" name="course"><br><br>
    <h3>Skills</h3>
    <input type="checkbox" name="skill">
    <label for="">HTML</label>
    <input type="range" min="10" max="100"><br>
    <input type="checkbox" name="skill">
    <label for="">CSS</label>
    <input type="range" min="10" max="100"><br>
    <input type="checkbox" name="skill">
    <label for="">Javascript</label>
    <input type="range" min="10" max="100"><br><br>
    <label for="">Color</label>
    <input type="color"><br><br>
    <label for="">Password</label>
    <input type="password"><br><br>
    <label for="">Portfolio link</label>
    <input type="url"><br><br>
    <label for="">Photo</label>
    <input type="file"><br><br>
    <input type="submit">
    <input type="reset"><br><br>
    <input type="button" value="click"><br><br>
    </form>
</body>
</html>
